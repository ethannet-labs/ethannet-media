spring:
  application:
    name: photos-api
  datasource:
    # Defaults match compose.yaml. Override per environment with env vars.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/photos}
    username: ${DB_USERNAME:photos}
    password: ${DB_PASSWORD:photos}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate

server:
  # Loopback only by default, so the api is never reachable from the network.
  # Set SERVER_ADDRESS=0.0.0.0 only where it must be (e.g. inside a container).
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:4001}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    # Comma-separated list of browser origins allowed to call /api/**.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
